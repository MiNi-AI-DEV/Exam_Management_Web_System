<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Exam Management System</title>
<link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            EMS
        </div>
        <h1>Admin Login</h1>
        <p class="login-subtitle">
            Welcome Back! Please login to your account.</p>
            <form onsubmit="handleLogin(event, 'admin')">
                <label for="admin-username">Admin username</label>
                <input type="text"
                id="admin-username"
                name="username"
                autocomplete="username"
                placeholder="Enter admin username" required>

                <label for="admin-password">Password</label>
                <input type="password"
                id="admin-password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password" required>

                <button type="submit" class="login-submit">Login as admin</button>
                <p class="form-message" id="admin-login-message" aria-live="polite"></p>

                </form>

        <p class="back-home">
            <a href="index.html">Back to Home</a>
        </p>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
