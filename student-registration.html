<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Exam Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page registration-page">
    <main class="login-container registration-container">
        <a class="text-back-link" href="index.html">EMS / Home</a>
        <div class="login-logo" aria-hidden="true">EMS</div>
        <p class="welcome-text">STUDENT ENROLLMENT</p>
        <h1>Create your account</h1>
        <p class="login-subtitle">Enter your details to register for the Java examination.</p>

        <!-- This form collects profile and credential fields for the Spring Boot registration API. -->
        <form class="registration-form" onsubmit="handleRegistration(event)">
            <div class="form-grid">
                <div class="form-field">
                    <label for="student-full-name">Full name</label>
                    <input id="student-full-name" name="fullName" type="text" autocomplete="name" required maxlength="120">
                </div>
                <div class="form-field">
                    <label for="student-date-of-birth">Date of birth</label>
                    <input id="student-date-of-birth" name="dateOfBirth" type="date" required>
                </div>
                <div class="form-field">
                    <label for="student-age">Age</label>
                    <input id="student-age" name="age" type="number" required readonly aria-describedby="age-note">
                    <small id="age-note">Calculated from your date of birth.</small>
                </div>
                <div class="form-field">
                    <label for="student-contact">Contact number</label>
                    <input id="student-contact" name="contactNumber" type="tel" autocomplete="tel" required maxlength="30">
                </div>
                <div class="form-field form-field-wide">
                    <label for="student-address">Address</label>
                    <textarea id="student-address" name="address" rows="3" autocomplete="street-address" required maxlength="500"></textarea>
                </div>
                <div class="form-field">
                    <label for="student-qualification">Last qualification</label>
                    <input id="student-qualification" name="lastQualification" type="text" required maxlength="100" placeholder="e.g. Higher Secondary">
                </div>
                <div class="form-field">
                    <label for="student-percentage">Percentage of marks</label>
                    <input id="student-percentage" name="qualificationPercentage" type="number" min="0" max="100" step="0.01" required>
                </div>
                <div class="form-field">
                    <label for="new-student-username">Choose a username</label>
                    <input id="new-student-username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="50">
                </div>
                <div class="form-field">
                    <label for="new-student-password">Choose a password</label>
                    <input id="new-student-password" name="password" type="password" autocomplete="new-password" required minlength="8">
                </div>
                <div class="form-field form-field-wide">
                    <label for="confirm-student-password">Confirm password</label>
                    <input id="confirm-student-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
                </div>
            </div>
            <p class="form-message" id="registration-message" aria-live="polite"></p>
            <button type="submit" class="login-submit">Create student account</button>
        </form>
        <p class="registration-prompt">Already registered? <a href="student-login.html">Student login</a></p>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
