<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Exam Management System</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            EMS
        </div>
        <h1>Student Login</h1>
        <p class="login-subtitle">
            Welcome Back! Please login to your account.</p>
            <form onsubmit="handleLogin(event, 'student')">
                <label for="student-username">Username</label>
                <input type="text"
                id="student-username"
                name="username"
                autocomplete="username"
                placeholder="Enter your username" required>

                <label for="student-password">Password</label>
                <input type="password"
                id="student-password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password" required>

                <button type="submit" class="login-submit">Login as student</button>
                <p class="form-message" id="student-login-message" aria-live="polite"></p>

                </form>

        <p class="registration-prompt">New student? <a href="student-registration.html">Create an account</a></p>

        <p class="back-home">
            <a href="index.html">Back to Home</a>
        </p>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
